<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Brain Tumor Detection using Deep Learning</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Page-specific styles for the patient form */
        header {
            width: 100%;
            background-color: #5276eb;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            position: fixed;
            top: 0;
            left: 0;
            font-family: 'Times New Roman', Times, serif;
        }
        .container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
            margin-top: 120px; /* leave space for fixed header */
        }
        h1 {
            color: #5fb4ff;
        }
        input, select {
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #4d46d4;
            width: 100%;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input[type="submit"] {
            background-color: #5276eb;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        input[type="submit"]:hover {
            background-color: #541ad2;
        }
        /* Chatbot button styling */
        .chatbot-btn {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #030609;
            color: rgb(189, 234, 232);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .chatbot-btn:hover {
            background-color: #000001;
        }
    </style>
</head>
<body>
    <header>
        <h1>Brain Tumor Detection using Deep Learning</h1>
    </header>
    <div class="container">
        <h2>Enter Patient Details</h2>
        <form method="POST">
            Name:<br><input type="text" name="name" placeholder="Enter name" required><br>
            Age:<br><input type="number" name="age" placeholder="Enter age" required><br>
            Gender:<br>
            <select name="gender" required>
                <option value="" disabled selected>Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select><br>
            Email:<br><input type="email" name="email" placeholder="Enter email address" required><br>
            Contact:<br><input type="text" name="contact" placeholder="Enter contact number" required><br>
            <input type="submit" value="Proceed to Prediction">
        </form>
    </div>
</body>
</html>
